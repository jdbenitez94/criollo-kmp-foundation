name: CI
# ubuntu-24.04 / JDK 21; prefer Node 24 for JS actions on runners.

on:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches:
      - main
      - dev
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

env:
  JDK_VERSION: '21'
  JDK_DISTRIBUTION: temurin
  GRADLE_MEMORY: 3072M
  # Write Gradle User Home cache only on long-lived branches (main/dev), like Saveable.
  # PRs and feature/* (etc.) are read-only and restore from the PR base branch and/or
  # the repo default branch (GitHub Actions cache scoping).
  GRADLE_CACHE_READ_ONLY: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev' }}
  OWASP_NVD_DIR: ${{ github.workspace }}/.owasp-nvd
  # Secrets are available on same-repo maintainer PRs and pushes, not Dependabot/forks.
  HAS_REPO_SECRETS: ${{ github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}

jobs:
  # Independent of OWASP: a 60-minute NVD timeout must not skip tests.
  build:
    name: Quality, tests, and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require Codacy credentials
        if: env.HAS_REPO_SECRETS == 'true'
        env:
          CODACY_API_TOKEN: ${{ secrets.CODACY_API_TOKEN }}
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
        run: |
          if [ -z "${CODACY_API_TOKEN}" ] && [ -z "${CODACY_PROJECT_TOKEN}" ]; then
            echo "::error::Set GitHub secret CODACY_API_TOKEN (account token) or CODACY_PROJECT_TOKEN (see BADGES-SETUP.md)."
            exit 1
          fi

      - name: Setup Gradle for CI
        uses: ./.github/actions/setup-gradle-ci
        with:
          jdk-version: ${{ env.JDK_VERSION }}
          jdk-distribution: ${{ env.JDK_DISTRIBUTION }}
          gradle-memory: ${{ env.GRADLE_MEMORY }}
          cache-read-only: ${{ env.GRADLE_CACHE_READ_ONLY }}
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Ensure Android SDK platform 37
        uses: ./.github/actions/setup-android-sdk

      - name: Quality checks and JVM tests
        run: |
          ./gradlew qualityCheck jvmLibraryTests koverXmlReport \
            --configuration-cache \
            --configuration-cache-problems=fail

      - name: Upload coverage to Codecov
        if: env.HAS_REPO_SECRETS == 'true'
        continue-on-error: true
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: jdbenitez94/criollo-kmp-foundation
          files: build/reports/kover/report.xml
          fail_ci_if_error: false

      - name: Upload coverage to Codacy
        if: env.HAS_REPO_SECRETS == 'true'
        continue-on-error: true
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699 # v1.3.0
        with:
          # Prefer account API token; project-token wins inside the action if both are set.
          api-token: ${{ secrets.CODACY_API_TOKEN }}
          project-token: ${{ secrets.CODACY_API_TOKEN == '' && secrets.CODACY_PROJECT_TOKEN || '' }}
          coverage-reports: build/reports/kover/report.xml

  security:
    name: Security scan
    if: github.event_name == 'push' || (github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require NVD API key
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -z "${NVD_API_KEY}" ]; then
            echo "::error::NVD_API_KEY secret is required for OWASP Dependency Check (see BADGES-SETUP.md). Without it, NVD updates are heavily rate-limited."
            exit 1
          fi

      - name: NVD cache date
        id: nvd-date
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Restore NVD database cache
        id: nvd-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.OWASP_NVD_DIR }}
          key: owasp-nvd-${{ runner.os }}-${{ steps.nvd-date.outputs.day }}
          restore-keys: |
            owasp-nvd-${{ runner.os }}-

      - name: Setup Gradle for CI
        uses: ./.github/actions/setup-gradle-ci
        with:
          jdk-version: ${{ env.JDK_VERSION }}
          jdk-distribution: ${{ env.JDK_DISTRIBUTION }}
          gradle-memory: ${{ env.GRADLE_MEMORY }}
          cache-read-only: ${{ env.GRADLE_CACHE_READ_ONLY }}
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: OWASP Dependency Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          mkdir -p "${OWASP_NVD_DIR}"
          ./gradlew dependencyCheckAnalyze \
            --no-configuration-cache \
            -PdependencyCheck.failBuildOnCVSS=7.0

      - name: Save NVD database cache
        if: always() && steps.nvd-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.OWASP_NVD_DIR }}
          key: owasp-nvd-${{ runner.os }}-${{ steps.nvd-date.outputs.day }}
