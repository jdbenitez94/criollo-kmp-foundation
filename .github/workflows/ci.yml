name: CI
# ubuntu-24.04 / JDK 21; prefer Node 24 for JS actions on runners.

on:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches:
      - main
      - dev
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

env:
  JDK_VERSION: '21'
  JDK_DISTRIBUTION: temurin
  GRADLE_MEMORY: 3072M
  # Write Gradle User Home cache only on long-lived branches (main/dev), like Saveable.
  # PRs and feature/* (etc.) are read-only and restore from the PR base branch and/or
  # the repo default branch (GitHub Actions cache scoping).
  GRADLE_CACHE_READ_ONLY: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev' }}

jobs:
  security:
    name: Security scan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require NVD API key
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -z "${NVD_API_KEY}" ]; then
            echo "::error::NVD_API_KEY secret is required for OWASP Dependency Check (see BADGES-SETUP.md). Without it, NVD updates are heavily rate-limited."
            exit 1
          fi

      - name: Setup Gradle for CI
        uses: ./.github/actions/setup-gradle-ci
        with:
          jdk-version: ${{ env.JDK_VERSION }}
          jdk-distribution: ${{ env.JDK_DISTRIBUTION }}
          gradle-memory: ${{ env.GRADLE_MEMORY }}
          cache-read-only: ${{ env.GRADLE_CACHE_READ_ONLY }}
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: OWASP Dependency Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          ./gradlew dependencyCheckAnalyze \
            --no-configuration-cache \
            -PdependencyCheck.failBuildOnCVSS=7.0

  build:
    name: Quality, tests, and coverage
    runs-on: ubuntu-24.04
    needs: security
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require Codacy project token
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
        run: |
          if [ -z "${CODACY_PROJECT_TOKEN}" ]; then
            echo "::error::CODACY_PROJECT_TOKEN secret is required. Add the Codacy project API token (see BADGES-SETUP.md)."
            exit 1
          fi

      - name: Setup Gradle for CI
        uses: ./.github/actions/setup-gradle-ci
        with:
          jdk-version: ${{ env.JDK_VERSION }}
          jdk-distribution: ${{ env.JDK_DISTRIBUTION }}
          gradle-memory: ${{ env.GRADLE_MEMORY }}
          cache-read-only: ${{ env.GRADLE_CACHE_READ_ONLY }}
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Quality checks and JVM tests
        run: |
          ./gradlew qualityCheck jvmLibraryTests koverXmlReport \
            --configuration-cache \
            --configuration-cache-problems=fail

      - name: Codacy static analysis
        uses: codacy/codacy-analysis-cli-action@562ee3e92b8e92df8b67e0a5ff8aa8e261919c08 # v4.4.7
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          upload: true
          gh-code-scanning-compat: true
          # Detekt/KtLint remain the local quality gates; Codacy upload is mandatory.

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: jdbenitez94/criollo-kmp-foundation
          files: build/reports/kover/report.xml
          fail_ci_if_error: true

      - name: Upload coverage to Codacy
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699 # v1.3.0
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: build/reports/kover/report.xml
