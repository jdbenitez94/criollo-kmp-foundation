# release-please on main: opens/updates a release PR from conventional commits.
# When that PR merges, it creates tag vX.Y.Z + GitHub Release, then publishes to Maven Central
# in this same workflow (GITHUB_TOKEN tag pushes do not trigger release.yml).
name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  # Prefer Node.js 24 LTS for JS actions; release-please-action@v5 already declares node24.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-24.04
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0 (node24)
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please pushes with GITHUB_TOKEN do not trigger other workflows, so
      # normalize-release-changelog.yml never sees that branch push. Fix MD012 here.
      - name: Checkout for CHANGELOG normalize
        if: steps.release.outputs.pr != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Collapse consecutive CHANGELOG blank lines
        if: steps.release.outputs.pr != ''
        env:
          PR_JSON: ${{ steps.release.outputs.pr }}
        run: |
          set -euo pipefail
          BRANCH="$(printf '%s' "$PR_JSON" | jq -r '.headBranchName // empty')"
          if [ -z "$BRANCH" ] || [ "$BRANCH" = "null" ]; then
            echo "No headBranchName in release PR JSON; skipping"
            exit 0
          fi
          git fetch origin "$BRANCH"
          git checkout -B "$BRANCH" "origin/$BRANCH"
          python3 scripts/normalize-changelog-blanks.py CHANGELOG.md
          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG already clean"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "chore(changelog): collapse consecutive blank lines"
          git push origin "HEAD:$BRANCH"

  publish:
    name: Publish Maven Central
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/publish-maven-central.yml
    secrets: inherit
    with:
      ref: ${{ needs.release-please.outputs.tag_name }}
