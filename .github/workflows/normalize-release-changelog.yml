# release-please writes an extra blank line before ### sections (MD012 / Codacy).
# Upstream will not change that formatting; normalize on the release PR branch.
# https://github.com/googleapis/release-please/issues/2085
name: Normalize release CHANGELOG

on:
  push:
    branches:
      - 'release-please--branches--*'
      - 'release-please--branches--**'
    paths:
      - 'CHANGELOG.md'

concurrency:
  group: normalize-changelog-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  normalize:
    name: Collapse CHANGELOG blank lines
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Push back to the release-please branch.
          token: ${{ github.token }}

      - name: Normalize consecutive blank lines
        run: python3 scripts/normalize-changelog-blanks.py CHANGELOG.md

      - name: Commit and push if changed
        run: |
          set -euo pipefail
          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG already clean"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "chore(changelog): collapse consecutive blank lines"
          git push
