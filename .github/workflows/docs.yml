# Docs: required markdown + MkDocs + Dokka check. Deploy to GitHub Pages from main.
name: Docs

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JDK_VERSION: '21'
  JDK_DISTRIBUTION: temurin
  GRADLE_MEMORY: 3072M
  GRADLE_CACHE_READ_ONLY: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev' }}

jobs:
  docs:
    name: Docs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check markdown links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          fail: true
          args: >-
            --offline
            --no-progress
            README.md
            'docs/**/*.md'
            'config/**/*.md'

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install MkDocs
        run: pip install -r requirements-docs.txt

      - name: Build MkDocs
        # Repo markdown links to files outside docs/ (workflows, Kotlin sources);
        # lychee --offline is the required link check. MkDocs still must produce site/.
        run: mkdocs build

      - name: Detect Gradle wrapper
        id: gradle
        run: |
          if [ -f ./gradlew ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Gradle for CI
        if: steps.gradle.outputs.present == 'true'
        uses: ./.github/actions/setup-gradle-ci
        with:
          jdk-version: ${{ env.JDK_VERSION }}
          jdk-distribution: ${{ env.JDK_DISTRIBUTION }}
          gradle-memory: ${{ env.GRADLE_MEMORY }}
          cache-read-only: ${{ env.GRADLE_CACHE_READ_ONLY }}
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Generate Dokka HTML
        if: steps.gradle.outputs.present == 'true'
        run: ./gradlew dokkaGenerateHtml --configuration-cache --configuration-cache-problems=fail

      - name: Assemble Pages artifact
        run: |
          mkdir -p site/api
          if [ -d build/dokka/html ]; then
            cp -R build/dokka/html/. site/api/
          fi

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  pages:
    name: Deploy GitHub Pages
    needs: docs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
