# Reusable Maven Central publish (Portal OSSRH staging API + PGP signing).
# Called from release-please / tag release (releases) and publish-snapshots (dev).
name: Publish Maven Central

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to checkout (tag or SHA)
        required: false
        type: string
        default: ''
      snapshot:
        description: Publish next-patch -SNAPSHOT to Central Portal snapshots (skip Portal finalize)
        required: false
        type: boolean
        default: false
      version:
        description: Override version (-Pcriollo.version). Empty + snapshot=true → next patch SNAPSHOT
        required: false
        type: string
        default: ''

permissions:
  contents: read

env:
  JDK_VERSION: '21'
  JDK_DISTRIBUTION: temurin
  GRADLE_MEMORY: 3072M

jobs:
  publish:
    name: Publish to Maven Central
    # macOS + Xcode so iosArm64 / iosSimulatorArm64 publications are included.
    # Ubuntu-only publishes omit Apple variants (isXcodeAvailable() == false).
    runs-on: macos-15
    timeout-minutes: 120
    # Releases and snapshots share the OSSRH default staging repo (per credentials).
    # Overlapping uploads produced incomplete Central sets (0.1.6 / 0.1.7).
    concurrency:
      group: criollo-maven-central-publish
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}

      - name: Setup Gradle for CI
        uses: ./.github/actions/setup-gradle-ci
        with:
          jdk-version: ${{ env.JDK_VERSION }}
          jdk-distribution: ${{ env.JDK_DISTRIBUTION }}
          gradle-memory: ${{ env.GRADLE_MEMORY }}
          # Tag/release jobs restore cache; do not seed branch-scoped entries.
          cache-read-only: 'true'
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Resolve publish version
        id: ver
        run: |
          set -euo pipefail
          BASE="$(grep 'const val version' \
            build-logic/convention/src/main/kotlin/io/github/jdbenitez94/criollo/kmp/foundation/buildlogic/ProjectConfig.kt \
            | sed -E 's/.*"([^"]+)".*/\1/')"
          OVERRIDE="${{ inputs.version }}"
          if [ -n "$OVERRIDE" ]; then
            VERSION="$OVERRIDE"
          elif [ "${{ inputs.snapshot }}" = "true" ]; then
            CORE="${BASE%%-*}"
            CORE="${CORE%%+*}"
            IFS=. read -r MAJ MIN PAT <<< "$CORE"
            VERSION="${MAJ}.${MIN}.$((PAT + 1))-SNAPSHOT"
          else
            VERSION="$BASE"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing version: $VERSION (base ProjectConfig=$BASE, snapshot=${{ inputs.snapshot }})"

      - name: Verify tag matches project version
        if: ${{ !inputs.snapshot && (startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.ref, 'v')) }}
        run: |
          REF="${{ inputs.ref }}"
          if [ -z "$REF" ]; then
            REF="${GITHUB_REF_NAME}"
          fi
          TAG="${REF#v}"
          EXPECTED="${{ steps.ver.outputs.version }}"
          test "$TAG" = "$EXPECTED"

      - name: Ensure Android SDK platform 37
        uses: ./.github/actions/setup-android-sdk

      - name: Quality checks and tests
        run: |
          ./gradlew qualityCheck jvmLibraryTests \
            -Pcriollo.version=${{ steps.ver.outputs.version }} \
            -Pcriollo.requireAppleTargets=true \
            --configuration-cache \
            --configuration-cache-problems=fail

      - name: Verify Apple KMP targets are registered
        run: |
          set -euo pipefail
          for module in coroutines coroutines:compose coroutines:viewmodel; do
            ./gradlew ":${module}:outgoingVariants" \
              -Pcriollo.version=${{ steps.ver.outputs.version }} \
              -Pcriollo.requireAppleTargets=true \
              --quiet \
              | tee "/tmp/${module//:/_}-variants.txt"
            grep -q 'iosArm64ApiElements' "/tmp/${module//:/_}-variants.txt"
            grep -q 'iosSimulatorArm64ApiElements' "/tmp/${module//:/_}-variants.txt"
            echo "Apple variants present for :${module}"
          done

      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.OSSRH_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.OSSRH_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryPassword: ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_signing.required: 'true'
        run: |
          ./gradlew publishAllPublicationsToMavenCentralRepository \
            -Pcriollo.version=${{ steps.ver.outputs.version }} \
            -Pcriollo.requireAppleTargets=true \
            --configuration-cache \
            --configuration-cache-problems=fail

      # Releases only: close staging → Portal (portal_api) → wait PUBLISHED → verify repo1.
      # Do not treat finalize HTTP 2xx alone as success (0.1.6/0.1.7 incomplete sets).
      # Snapshots: https://central.sonatype.com/repository/maven-snapshots/ (no finalize).
      # https://central.sonatype.org/publish/publish-portal-ossrh-staging-api/
      - name: Finalize Central Portal deployment
        id: portal
        if: ${{ !inputs.snapshot }}
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
          MAVEN_CENTRAL_NAMESPACE: ${{ vars.MAVEN_CENTRAL_NAMESPACE }}
        run: |
          chmod +x scripts/maven-central/finalize-portal-deployment.sh
          scripts/maven-central/finalize-portal-deployment.sh

      - name: Verify full artifact set on Maven Central
        if: ${{ !inputs.snapshot }}
        env:
          RELEASE_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          chmod +x scripts/maven-central/verify-release-on-central.sh
          scripts/maven-central/verify-release-on-central.sh
