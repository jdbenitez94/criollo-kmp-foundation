# Reusable Maven Central publish (Portal OSSRH staging API + PGP signing).
# Called from release-please / tag release (releases) and publish-snapshots (dev).
name: Publish Maven Central

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to checkout (tag or SHA)
        required: false
        type: string
        default: ''
      snapshot:
        description: Publish next-patch -SNAPSHOT to Central Portal snapshots (skip Portal finalize)
        required: false
        type: boolean
        default: false
      version:
        description: Override version (-Pcriollo.version). Empty + snapshot=true → next patch SNAPSHOT
        required: false
        type: string
        default: ''

permissions:
  contents: read

env:
  JDK_VERSION: '21'
  JDK_DISTRIBUTION: temurin
  GRADLE_MEMORY: 3072M

jobs:
  publish:
    name: Publish to Maven Central
    # macOS + Xcode so iosArm64 / iosSimulatorArm64 publications are included.
    # Ubuntu-only publishes omit Apple variants (isXcodeAvailable() == false).
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}

      - name: Setup Gradle for CI
        uses: ./.github/actions/setup-gradle-ci
        with:
          jdk-version: ${{ env.JDK_VERSION }}
          jdk-distribution: ${{ env.JDK_DISTRIBUTION }}
          gradle-memory: ${{ env.GRADLE_MEMORY }}
          # Tag/release jobs restore cache; do not seed branch-scoped entries.
          cache-read-only: 'true'
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Resolve publish version
        id: ver
        run: |
          set -euo pipefail
          BASE="$(grep 'const val version' \
            build-logic/convention/src/main/kotlin/io/github/jdbenitez94/criollo/kmp/foundation/buildlogic/ProjectConfig.kt \
            | sed -E 's/.*"([^"]+)".*/\1/')"
          OVERRIDE="${{ inputs.version }}"
          if [ -n "$OVERRIDE" ]; then
            VERSION="$OVERRIDE"
          elif [ "${{ inputs.snapshot }}" = "true" ]; then
            CORE="${BASE%%-*}"
            CORE="${CORE%%+*}"
            IFS=. read -r MAJ MIN PAT <<< "$CORE"
            VERSION="${MAJ}.${MIN}.$((PAT + 1))-SNAPSHOT"
          else
            VERSION="$BASE"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing version: $VERSION (base ProjectConfig=$BASE, snapshot=${{ inputs.snapshot }})"

      - name: Verify tag matches project version
        if: ${{ !inputs.snapshot && (startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.ref, 'v')) }}
        run: |
          REF="${{ inputs.ref }}"
          if [ -z "$REF" ]; then
            REF="${GITHUB_REF_NAME}"
          fi
          TAG="${REF#v}"
          EXPECTED="${{ steps.ver.outputs.version }}"
          test "$TAG" = "$EXPECTED"

      - name: Ensure Android SDK platform 37
        uses: ./.github/actions/setup-android-sdk

      - name: Quality checks and tests
        run: |
          ./gradlew qualityCheck jvmLibraryTests \
            -Pcriollo.version=${{ steps.ver.outputs.version }} \
            -Pcriollo.requireAppleTargets=true \
            --configuration-cache \
            --configuration-cache-problems=fail

      - name: Verify Apple KMP targets are registered
        run: |
          set -euo pipefail
          ./gradlew :coroutines:outgoingVariants \
            -Pcriollo.version=${{ steps.ver.outputs.version }} \
            -Pcriollo.requireAppleTargets=true \
            --quiet \
            | tee /tmp/coroutines-variants.txt
          grep -q 'iosArm64ApiElements' /tmp/coroutines-variants.txt
          grep -q 'iosSimulatorArm64ApiElements' /tmp/coroutines-variants.txt
          echo "Apple variants present for :coroutines"

      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.OSSRH_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.OSSRH_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryPassword: ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_signing.required: 'true'
        run: |
          ./gradlew publishAllPublicationsToMavenCentralRepository \
            -Pcriollo.version=${{ steps.ver.outputs.version }} \
            -Pcriollo.requireAppleTargets=true \
            --configuration-cache \
            --configuration-cache-problems=fail

      # Releases only: Gradle maven-publish is "Maven-API-like"; finalize for Portal UI.
      # Snapshots go to https://central.sonatype.com/repository/maven-snapshots/ (no finalize).
      # https://central.sonatype.org/publish/publish-portal-ossrh-staging-api/
      # https://central.sonatype.org/publish/publish-portal-snapshots/
      - name: Finalize Central Portal deployment
        if: ${{ !inputs.snapshot }}
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
          MAVEN_CENTRAL_NAMESPACE: ${{ vars.MAVEN_CENTRAL_NAMESPACE }}
        run: |
          set -o pipefail
          AUTH="$(printf '%s:%s' "$OSSRH_USERNAME" "$OSSRH_PASSWORD" | base64 | tr -d '\n')"
          URL="https://ossrh-staging-api.central.sonatype.com/manual/upload/defaultRepository/${MAVEN_CENTRAL_NAMESPACE}?publishing_type=user_managed"
          RESPONSE="$(curl --silent --show-error --connect-timeout 30 --max-time 300 \
            --write-out $'\n%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${AUTH}" \
            -H "Content-Type: application/json" \
            "$URL")"
          HTTP_CODE="${RESPONSE##*$'\n'}"
          BODY="${RESPONSE%$'\n'*}"

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "::notice title=Maven Central::Upload finalized (user_managed). Publish manually at https://central.sonatype.com/publishing"
            exit 0
          fi

          echo "::error title=Central Portal finalize failed (HTTP ${HTTP_CODE})::${BODY}"
          exit 1
