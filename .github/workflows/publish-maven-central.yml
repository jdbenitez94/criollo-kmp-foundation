# Reusable Maven Central publish (Portal OSSRH staging API + PGP signing).
# Called from release-please (same workflow run) and from tag-push release.yml.
name: Publish Maven Central

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to checkout (tag or SHA)
        required: false
        type: string
        default: ''

permissions:
  contents: read

env:
  JDK_VERSION: '21'
  JDK_DISTRIBUTION: temurin
  GRADLE_MEMORY: 3072M

jobs:
  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}

      - name: Setup Gradle for CI
        uses: ./.github/actions/setup-gradle-ci
        with:
          jdk-version: ${{ env.JDK_VERSION }}
          jdk-distribution: ${{ env.JDK_DISTRIBUTION }}
          gradle-memory: ${{ env.GRADLE_MEMORY }}
          # Tag/release jobs restore cache; do not seed branch-scoped entries.
          cache-read-only: 'true'
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Verify tag matches project version
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.ref, 'v')
        run: |
          REF="${{ inputs.ref }}"
          if [ -z "$REF" ]; then
            REF="${GITHUB_REF_NAME}"
          fi
          TAG="${REF#v}"
          EXPECTED="$(grep 'const val version' build-logic/convention/src/main/kotlin/io/github/jdbenitez94/criollo/kmp/foundation/buildlogic/ProjectConfig.kt | sed -E 's/.*"([^"]+)".*/\1/')"
          test "$TAG" = "$EXPECTED"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Quality checks and tests
        run: |
          ./gradlew qualityCheck jvmLibraryTests \
            --configuration-cache \
            --configuration-cache-problems=fail

      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.OSSRH_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.OSSRH_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryPassword: ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_signing.required: 'true'
        run: |
          ./gradlew publishAllPublicationsToMavenCentralRepository \
            --configuration-cache \
            --configuration-cache-problems=fail

      # Gradle maven-publish is "Maven-API-like": finalize so the deployment appears in the Portal.
      # https://central.sonatype.org/publish/publish-portal-ossrh-staging-api/
      - name: Finalize Central Portal deployment
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
          MAVEN_CENTRAL_NAMESPACE: ${{ vars.MAVEN_CENTRAL_NAMESPACE }}
        run: |
          AUTH="$(printf '%s:%s' "$OSSRH_USERNAME" "$OSSRH_PASSWORD" | base64 | tr -d '\n')"
          curl --fail-with-body -X POST \
            -H "Authorization: Bearer ${AUTH}" \
            -H "Content-Type: application/json" \
            "https://ossrh-staging-api.central.sonatype.com/manual/upload/defaultRepository/${MAVEN_CENTRAL_NAMESPACE}?publishing_type=user_managed"
