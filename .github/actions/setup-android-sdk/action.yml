name: 'Ensure Android SDK platform'
description: >
  Ensures platforms/android-37 exists for the Android KMP library target.
  On ubuntu-24.04 uses the preinstalled ANDROID_HOME image SDK. On macOS
  (Maven publish) bootstraps cmdline-tools under $HOME/android-sdk when needed.

runs:
  using: composite
  steps:
    - name: Ensure platforms/android-37
      shell: bash
      run: |
        set -euo pipefail

        if [[ -z "${ANDROID_HOME:-}" ]]; then
          if [[ "$(uname -s)" == Darwin ]]; then
            ANDROID_HOME="${HOME}/android-sdk"
            echo "ANDROID_HOME=${ANDROID_HOME}" >> "$GITHUB_ENV"
            export ANDROID_HOME
          else
            echo "::error::ANDROID_HOME must be set on Linux runners"
            exit 1
          fi
        fi

        platforms="${ANDROID_HOME}/platforms"
        wanted="${platforms}/android-37"
        dotted="${platforms}/android-37.0"

        if [[ -d "${wanted}" ]]; then
          echo "Using ${wanted}"
          exit 0
        fi

        if [[ -d "${dotted}" ]]; then
          ln -s "${dotted}" "${wanted}"
          echo "Symlinked android-37 -> android-37.0 (runner image layout)"
          exit 0
        fi

        sdkmanager="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"
        if [[ -z "${sdkmanager}" || ! -x "${sdkmanager}" ]]; then
          if [[ "$(uname -s)" != Darwin ]]; then
            echo "::error::sdkmanager not found under ${ANDROID_HOME}/cmdline-tools"
            exit 1
          fi
          echo "Bootstrapping Android cmdline-tools under ${ANDROID_HOME}"
          mkdir -p "${ANDROID_HOME}/cmdline-tools"
          tmp="$(mktemp -d)"
          curl -fsSL -o "${tmp}/cmdtools.zip" \
            https://dl.google.com/android/repository/commandlinetools-mac-13114758_latest.zip
          unzip -q "${tmp}/cmdtools.zip" -d "${tmp}"
          rm -rf "${ANDROID_HOME}/cmdline-tools/latest"
          mv "${tmp}/cmdline-tools" "${ANDROID_HOME}/cmdline-tools/latest"
          rm -rf "${tmp}"
          sdkmanager="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
        fi

        yes | "${sdkmanager}" --licenses >/dev/null || true
        "${sdkmanager}" --install "platforms;android-37" \
          || "${sdkmanager}" --install "platforms;android-37.0"

        if [[ ! -d "${wanted}" && -d "${dotted}" ]]; then
          ln -s "${dotted}" "${wanted}"
        fi

        if [[ ! -d "${wanted}" && ! -d "${dotted}" ]]; then
          echo "::error::Failed to provision Android API 37 under ${platforms}"
          ls -la "${platforms}" || true
          exit 1
        fi
        echo "Provisioned Android API 37 at ${ANDROID_HOME}"
