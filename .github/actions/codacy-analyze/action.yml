name: 'Codacy analysis CLI'
description: >
  Runs Codacy Analysis CLI (dockerized tools) and uploads results. Avoids
  codacy-analysis-cli-action, which nests unpinned actions/setup-go@v3 and
  fails sha_pinning_required even when Staticcheck is off.

inputs:
  api-token:
    description: Codacy account API token (preferred with provider/username/project)
    required: false
    default: ''
  project-token:
    description: Codacy project API token (fallback if api-token is empty)
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Run Codacy Analysis CLI
      shell: bash
      env:
        CODACY_API_TOKEN: ${{ inputs.api-token }}
        CODACY_PROJECT_TOKEN: ${{ inputs.project-token }}
        COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        # Same CLI/docker tag as codacy-analysis-cli-action@v4.4.7
        CLI_VERSION: '7.9.25'
        CODACY_ANALYSIS_CLI_VERSION: '7.9.25'
      run: |
        set -euo pipefail
        OWNER="${GITHUB_REPOSITORY%%/*}"
        REPO="${GITHUB_REPOSITORY##*/}"
        if [ -z "${CODACY_API_TOKEN}" ] && [ -z "${CODACY_PROJECT_TOKEN}" ]; then
          echo "::error::Set CODACY_API_TOKEN or CODACY_PROJECT_TOKEN."
          exit 1
        fi
        # setup-gradle-ci rewrites gradle.properties; upload requires a clean tree.
        git checkout -- gradle.properties
        SCRIPT="${RUNNER_TEMP}/codacy-analysis-cli.sh"
        curl -fsSL "https://raw.githubusercontent.com/codacy/codacy-analysis-cli/${CLI_VERSION}/bin/codacy-analysis-cli.sh" \
          -o "${SCRIPT}"
        chmod +x "${SCRIPT}"
        AUTH=()
        if [ -n "${CODACY_API_TOKEN}" ]; then
          AUTH=(--api-token "${CODACY_API_TOKEN}" --provider gh --username "${OWNER}" --project "${REPO}")
          CURL_AUTH="api-token: ${CODACY_API_TOKEN}"
        else
          AUTH=(--project-token "${CODACY_PROJECT_TOKEN}")
          CURL_AUTH="project-token: ${CODACY_PROJECT_TOKEN}"
        fi
        "${SCRIPT}" analyze \
          "${AUTH[@]}" \
          --upload \
          --gh-code-scanning-compat \
          --skip-commit-uuid-validation \
          --skip-uncommitted-files-check \
          --max-allowed-issues 2147483647 \
          --commit-uuid "${COMMIT_SHA}"
        curl -fsSL -X POST \
          -H "${CURL_AUTH}" \
          -H "Content-type: application/json" \
          "https://api.codacy.com/2.0/gh/${OWNER}/${REPO}/commit/${COMMIT_SHA}/resultsFinal"
