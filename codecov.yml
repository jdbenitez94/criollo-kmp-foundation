# Repository Codecov config (overrides org defaults).
# Docs: https://docs.codecov.com/docs/codecov-yaml
# Validate: curl --data-binary @codecov.yml https://codecov.io/validate

codecov:
  branch: main
  require_ci_to_pass: true
  notify:
    wait_for_ci: true

coverage:
  precision: 2
  round: down
  # UI color range (green when above Kover gate).
  range: 70..100
  status:
    project:
      default:
        # Align with Kover `minBound(70)` on published libraries.
        target: 70%
        threshold: 1%
        if_ci_failed: error
    patch:
      default:
        target: 70%
        threshold: 1%
        if_ci_failed: error

# Paths outside the Kover merge (or not product code). Patterns are regex/glob.
ignore:
  - "build-logic/**/*"
  - "project-conventions/**/*"
  - "docs/**/*"
  - "**/build/**/*"
  - "**/generated/**/*"
  - "**/*_Generated*"

comment:
  layout: "header, diff, flags, components, files"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true
