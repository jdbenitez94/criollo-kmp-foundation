site_name: Criollo KMP Foundation
site_description: Kotlin Multiplatform foundation libraries — keyed TaskScope and shared infrastructure.
site_url: https://jdbenitez94.github.io/criollo-kmp-foundation/
repo_url: https://github.com/jdbenitez94/criollo-kmp-foundation
repo_name: jdbenitez94/criollo-kmp-foundation

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

nav:
  - Home: index.md
  - Guides:
      - Managed tasks: managed-tasks.md
      - Project conventions: project-conventions.md
      - JS / Wasm: js-wasm.md
      - Adding a module: adding-a-module.md
      - Publishing: publishing.md
  - Contributing:
      - Contributing: contributing.md
      - Commit conventions: commit-conventions.md
  - API reference: api.md

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences

plugins:
  - search
