# ==============================================================================
# criollo-kmp-foundation - Gradle Configuration
# ==============================================================================
# This file contains optimized configurations for LOCAL DEVELOPMENT.
# Dependency versions are located in gradle/libs.versions.toml
#
# Structure and defaults for this monorepo (same machine / same toolchain).
#
# IMPORTANT: In CI/CD (GitHub Actions), memory/daemon/vfs settings are overwritten
# via sed in .github/actions/setup-gradle-ci to fit limited runners.
# ==============================================================================

# ==============================================================================
# DEVELOPMENT vs CI/CD
# ==============================================================================
# This file is optimized for local development with the following features:
#
# - Memory: 8GB for Gradle and Kotlin daemon (suitable for modern machines)
# - Daemon: Enabled for faster builds in development
# - File System Watching: Enabled to detect changes automatically
# - Workers: Configured to leverage multiple CPU cores
#
# In CI/CD (GitHub Actions):
# - Prefer leaner memory via runner env / setup steps if added
# - Configuration cache may be toggled per workflow
# ==============================================================================

# ==============================================================================
# DEVELOPMENT CONFIGURATION
# ==============================================================================
# Specific settings for local development that improve developer experience
# but are not necessary (or even counterproductive) in CI/CD.

# Gradle Daemon - Keeps a background process for faster builds
# In local development, the daemon reuses state between builds, significantly
# reducing compilation times after the first build.
org.gradle.daemon=true
# Daemon timeout: 4 hours (14,400,000 ms)
# This allows the daemon to stay active during long development sessions
# without needing constant restarts.
org.gradle.daemon.idletimeout=14400000

# File System Watching - Detects file changes automatically
# In local development, this allows Gradle to detect changes without scanning
# the entire file system, improving build times.
org.gradle.vfs.watch=true

# Console Output - Rich output for development (colors, progress bars, etc.)
# In local development, Gradle's rich output improves the visual experience.
# In CI/CD, 'plain' can be enabled via GRADLE_OPTS for cleaner logs.
# org.gradle.console=plain # Commented: development uses rich output by default

# ==============================================================================
# MEMORY CONFIGURATION
# ==============================================================================
# Memory configuration for Gradle and Kotlin daemon.
# These values are optimized for local development on modern machines
# typically having 8GB+ of available RAM.

# Gradle JVM Memory — 8GB on 24GB+ hosts (M-series Macs). Gradle runs many non-native tasks in parallel.
# MaxMetaspaceSize is raised for composite builds (build-logic) and KMP extension decoration.
# If IDE sync fails with Metaspace OOM, run `./gradlew --stop` and align ~/.gradle/gradle.properties.
# Included builds: keep build-logic/gradle.properties in sync with this section.
#
# -XX:+UseZGC requires a JDK that supports it (Temurin 21). Android Studio Embedded JBR
# (JDK 25) rejects this flag — this project pins Gradle JVM to Temurin 21 via
# .idea/gradle.xml (and ~/.gradle org.gradle.java.home). Do not add -XX:+ZGenerational
# (removed in JDK 24+). After changing jvmargs: ./gradlew --stop then re-sync.
org.gradle.jvmargs=-Xmx8192M -XX:+UseZGC -XX:MaxMetaspaceSize=3072m -Dfile.encoding=UTF-8

# Kotlin JVM compiler daemon — separate from Kotlin/Native linker heap below.
kotlin.daemon.jvmargs=-Xmx8192M -Dkotlin.daemon.client.alive.path="."

# ==============================================================================
# PERFORMANCE OPTIMIZATIONS
# ==============================================================================
# Configurations that improve performance in both development and CI/CD.
# These optimizations are enabled by default and are compatible with both environments.

# Build Cache - Reuses outputs from previous builds
# Allows Gradle to reuse results from tasks of previous builds,
# significantly reducing compilation times when there are no changes.
org.gradle.caching=true

# Configuration Cache - Caches project configuration
# Stores project configuration in cache, allowing further builds
# to skip the configuration phase completely if there are no changes.
org.gradle.configuration-cache=true
# Kotlin JS/Wasm webpack/test tasks are not fully configuration-cache compatible yet;
# warn instead of failing plain `./gradlew build` (CI may use --no-configuration-cache).
org.gradle.configuration-cache.problems=warn
# Configuration Cache Parallel - Allows parallel configuration
# Further improves performance by allowing multiple projects to be
# configured in parallel when using configuration cache.
org.gradle.configuration-cache.parallel=true

# Parallel Execution - Runs tasks in parallel when possible
# Leverages multiple CPU cores to run independent tasks
# simultaneously, reducing total build time.
org.gradle.parallel=true

# Configure on Demand - Disabled for Kotlin Multiplatform projects.
# Kotlin JS/Wasm targets do not support this mode reliably (KT-52074);
# configuration cache remains enabled for performance.
org.gradle.configureondemand=false

# Workers - Maximum number of workers for parallel execution (ONLY FOR LIMITED CPU DEVICES)
# Adjust this value according to the number of CPU cores available on your
# development machine. Recommendations:
# - 2-4 cores: 2 workers
# - 4-8 cores: 4 workers
# - 8+ cores: 6-8 workers
#org.gradle.workers.max=4

# Warning Mode - Shows all warnings
# Useful for identifying potential issues during development.
org.gradle.warning.mode=all

# Java/Kotlin Target - Java 21 (LTS)
# Toolchains / compiler target baseline for the repo.
# NOTE: Keep aligned with kotlin version and AGP expectations in gradle/libs.versions.toml
kotlin.jvmTarget=21
java.toolchain.version=21

# ==============================================================================
# ANDROID (AGP) - shared by all developers and CI
# ==============================================================================
# Machine-specific overrides: see local.properties (sdk.dir, optional AGP flags).
# Enable AndroidX dependency resolution (required for Compose / modern AGP).
android.useAndroidX=true
# Module-local R classes only; avoids transitive R class bloat (AGP 8+).
android.nonTransitiveRClass=true

# ==============================================================================
# KOTLIN CONFIGURATION
# ==============================================================================
# Specific configurations for the Kotlin compiler

# Code Style - Official Kotlin style
kotlin.code.style=official

# Incremental Compilation - Only recompiles modified files
# Significantly improves build times by recompiling only
# changed files and their dependencies.
kotlin.incremental=true
kotlin.incremental.jvm=true

# Parallel Compilation - Compiles modules in parallel
# In multi-module projects, allows compiling multiple modules simultaneously.
kotlin.parallel.tasks.in.project=true

# Compiler Execution Strategy - In-process for better performance
# Runs the compiler in the same process as Gradle, reducing inter-process
# communication overhead. In local development, this is more efficient.
#kotlin.compiler.execution.strategy=in-process

# Build Reports - Generates build reports for analysis
# Enables generation of build reports that can be useful for
# identifying bottlenecks and optimizing compilation times.
kotlin.build.report.enable=true

# Kotlin/Native linker heap (one Konan process at a time when links are serialized).
# Keep peak usage reasonable on 24GB RAM hosts when building iOS targets.
kotlin.native.jvmArgs=-Xmx10240M

# Intra-process native backend threads; keep at 1 — Gradle parallelism is handled separately.
kotlin.native.parallelThreads=1

# ==============================================================================
# EXPERIMENTAL FEATURES
# ==============================================================================
# Experimental Kotlin features (use with caution)

# K2 Compiler - Enabled by default since Kotlin 2.0+
# The K2 compiler is the next-generation Kotlin compiler and is
# enabled by default since Kotlin 2.0+. No additional configuration is required.

# To test future experimental features:
# kotlin.experimental.tryNext=true

# ==============================================================================
# NOTES & REFERENCES
# ==============================================================================
# - Dependency versions: See gradle/libs.versions.toml
# - This file is optimized for local development
# - Memory: 8GB Gradle + 8GB Kotlin JVM daemon + 10GB Kotlin/Native
# - Cache and parallel build enabled for speed
# - File system watching enabled for interactive development
# - Machine-specific Android SDK: local.properties (not versioned)
# - Gradle JVM for -XX:+UseZGC: Temurin 21 (.idea/gradle.xml + ~/.gradle org.gradle.java.home)

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
