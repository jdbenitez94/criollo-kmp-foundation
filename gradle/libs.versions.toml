[versions]
agp = "9.3.1"
kotlin = "2.4.10"
compose-multiplatform = "1.11.1"
androidx-lifecycle-kmp = "2.11.0"
coroutines = "1.11.0"
detekt = "1.23.8"
# alpha.4+ detekt-test requests unpublished detekt-api test-fixtures (detekt/detekt#9543)
detekt2 = "2.0.0-alpha.6"
ktlint-engine = "1.8.0"
ktlint-engine-legacy = "1.5.0"
klint = "14.2.0"
dokka = "2.2.0"
# Forced onto Dokka classpaths (except jackson-annotations, which is 2.22).
# Dokka 2.2.0 still ships jackson-databind 2.15.3 (CVE-2026-54512/54513).
jackson = "2.22.2"
kover = "0.9.9"
dependencycheck = "13.0.0"
binary-compatibility-validator = "0.18.1"
strikt = "0.35.1"
tink = "1.23.0"
cryptography = "0.6.0"
jna = "5.19.1"
# DataStore: alpha aligns with saveable dogfood; prefer stable for Maven 1.0 (DEC-20).
androidx-datastore = "1.3.0-alpha10"
okio = "3.18.1"
kotlinx-serialization = "1.11.0"

[plugins]
org-jetbrains-compose = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
org-jetbrains-kotlin-plugin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
org-jetbrains-kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
org-jetbrains-kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
com-android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
org-jlleitschuh-gradle-ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "klint" }
io-gitlab-arturbosch-detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
dev-detekt = { id = "dev.detekt", version.ref = "detekt2" }
org-jetbrains-dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
org-jetbrains-kotlin-plugin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

# Convention plugins (build-logic) — kebab-case aliases → libs.plugins.convention.*
convention-root = { id = "convention.root" }
convention-ktlint = { id = "convention.ktlint" }
convention-detekt = { id = "convention.detekt" }
convention-dokka = { id = "convention.dokka" }
convention-kover-library = { id = "convention.kover.library" }
convention-kover-aggregation = { id = "convention.kover.aggregation" }
criollo-kmp-library = { id = "criollo.kmp-library" }
criollo-maven-publish = { id = "criollo.maven-publish" }
criollo-project-conventions = { id = "io.github.jdbenitez94.criollo.kmp.foundation.project-conventions" }
org-owasp-dependencycheck = { id = "org.owasp.dependencycheck", version.ref = "dependencycheck" }
org-jetbrains-kotlinx-binary-compatibility-validator = { id = "org.jetbrains.kotlinx.binary-compatibility-validator", version.ref = "binary-compatibility-validator" }

[libraries]
com-android-tools-build-gradle = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
org-jetbrains-kotlin-gradle-plugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
org-jetbrains-kotlinx-kover-gradle-plugin = { group = "org.jetbrains.kotlinx", name = "kover-gradle-plugin", version.ref = "kover" }
io-gitlab-arturbosch-detekt-gradle-plugin = { group = "io.gitlab.arturbosch.detekt", name = "detekt-gradle-plugin", version.ref = "detekt" }
io-gitlab-arturbosch-detekt-formatting = { group = "io.gitlab.arturbosch.detekt", name = "detekt-formatting", version.ref = "detekt" }
dev-detekt-gradle-plugin = { group = "dev.detekt", name = "detekt-gradle-plugin", version.ref = "detekt2" }
org-jlleitschuh-gradle-ktlint-gradle-plugin = { group = "org.jlleitschuh.gradle.ktlint", name = "org.jlleitschuh.gradle.ktlint.gradle.plugin", version.ref = "klint" }
org-jetbrains-dokka-gradle-plugin = { group = "org.jetbrains.dokka", name = "dokka-gradle-plugin", version.ref = "dokka" }

org-jetbrains-kotlin-test = { group = "org.jetbrains.kotlin", name = "kotlin-test", version.ref = "kotlin" }
org-jetbrains-kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
org-jetbrains-kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
org-jetbrains-compose-runtime = { group = "org.jetbrains.compose.runtime", name = "runtime", version.ref = "compose-multiplatform" }
org-jetbrains-compose-ui-test-junit4 = { group = "org.jetbrains.compose.ui", name = "ui-test-junit4", version.ref = "compose-multiplatform" }
org-jetbrains-androidx-lifecycle-viewmodel = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-viewmodel", version.ref = "androidx-lifecycle-kmp" }
org-jetbrains-androidx-lifecycle-viewmodel-compose = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle-kmp" }
io-strikt-bom = { group = "io.strikt", name = "strikt-bom", version.ref = "strikt" }
io-strikt-core = { group = "io.strikt", name = "strikt-core" }
com-google-crypto-tink-android = { group = "com.google.crypto.tink", name = "tink-android", version.ref = "tink" }
com-google-crypto-tink = { group = "com.google.crypto.tink", name = "tink", version.ref = "tink" }
net-java-dev-jna = { group = "net.java.dev.jna", name = "jna", version.ref = "jna" }
net-java-dev-jna-platform = { group = "net.java.dev.jna", name = "jna-platform", version.ref = "jna" }
dev-whyoleg-cryptography-core = { group = "dev.whyoleg.cryptography", name = "cryptography-core", version.ref = "cryptography" }
dev-whyoleg-cryptography-provider-apple = { group = "dev.whyoleg.cryptography", name = "cryptography-provider-apple", version.ref = "cryptography" }
androidx-datastore-core-okio = { group = "androidx.datastore", name = "datastore-core-okio", version.ref = "androidx-datastore" }
androidx-datastore-preferences-core = { group = "androidx.datastore", name = "datastore-preferences-core", version.ref = "androidx-datastore" }
com-squareup-okio-fakefilesystem = { group = "com.squareup.okio", name = "okio-fakefilesystem", version.ref = "okio" }
org-jetbrains-kotlinx-serialization-protobuf = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-protobuf", version.ref = "kotlinx-serialization" }
